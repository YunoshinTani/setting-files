[platformio]
build_dir = build
build_cache_dir = .cache
default_envs = nucleo_f446re

[env:nucleo_f446re]
platform = ststm32@20.0.0
framework = stm32cube
board = nucleo_f446re

platform_packages =
  toolchain-gccarmnoneeabi@1.140201.0
  framework-stm32cubef4@1.28.3
lib_deps =
  https://github.com/nnctroboticsclub/nbed/archive/refs/tags/v0.10.0.zip

board_build.stm32cube.custom_config_header = yes
extra_scripts = pre:compiledb.py

upload_protocol = stlink
monitor_speed = 921600
monitor_filters = direct
